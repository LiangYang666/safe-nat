<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      background: #0b0f14; color: #cbd5e1; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;

    .tag { display: inline-block; margin-top: 16px; padding: 4px 10px; border: 1px solid #22d3ee33;

</head>
<body>
  <div class="card">
    <h1><span class="logo">safe-nat</span> 管理面板</h1>
